<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сетка товаров</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .grid::after {
            content: "";
            display: block;
            height: 2px;
            background: red;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .grid > .product {
            background: gray;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .grid > .product:not(:first-child) {
            background: darkgray;
        }
    </style>
</head>
<body>
<div class="grid">
    <div class="product">Товар 1</div>
    <div class="product">Товар 2</div>
    <div class="product">Товар 3</div>
    <div class="product">Товар 4</div>
</div>
</body>
</html>
