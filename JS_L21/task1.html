<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Чётное или нечётное</title>
</head>
<body>
<input type="number" id="num" placeholder="Введите число">
<button id="btn">Проверить</button>
<p id="result"></p>

<script>
    let input = document.querySelector("#num");
    let button = document.querySelector("#btn");
    let output = document.querySelector("#result");

    button.onclick = function() {
        let value = input.value;

        if (value === "") {
            output.textContent = "Введите число!";        } else {
            let number = Number(value);

            if (number % 2 === 0) {
                output.textContent = "Число " + number + " - ЧЁТНОЕ";
            } else {
                output.textContent = "Число " + number + " - НЕЧЁТНОЕ";

            }
        }
    };
</script>
</body>
</html>
