<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>

        div{
            background:#20c9d8;
            border:2px solid #444;
            padding:20px;
            margin:15px;
            font-size:28px;
        }

        .a{
            border-radius:50px 0 0 50px;
        }

        .b{
            border-radius:60px 10px;
        }

        .c{
            border-radius:13em/3em;
        }

        .d{
            border-radius:13em 0.5em / 1em 0.5em;
        }

        .e{
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="a">border-radius: 50px 0 0 50px;</div>

<div class="b">border-radius: 40px 10px;</div>

<div class="c">border-radius: 13em/3em;</div>

<div class="d">border-radius: 13em 0.5em/1em 0.5em;</div>

<div class="e">border-radius: 8px;</div>

</body>
</html>
