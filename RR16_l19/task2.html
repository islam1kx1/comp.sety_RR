<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>

        .block{
            width:600px;
            margin:20px;
        }

        .title{
            background:#6699a5;
            color:white;
            font-size:50px;
            font-weight:bold;
            padding:20px;
        }

        .text{
            background:#e8f0eb;
            padding:15px;
            font-size:20px;
            background:lightblue;
        }
    </style>
</head>
<body>

<div class="block">
    <div class="title">Вот такой чай</div>

    <div class="text">
        История о том, как один человек хотел попить чайку,
        но по ошибке вместо воды попытался налить в чайник
        бензин, и что из этого получилось.
    </div>
</div>

</body>
</html>
