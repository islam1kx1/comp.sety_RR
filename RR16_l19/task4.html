<html>
<head>
    <meta charset="utf-8">
    <style>

        div{
            border:3px solid red;
            margin:10px;
        }

        .a{
            padding-left:2cm;
        }

        .b{
            padding-left:50%;
        }
    </style>
</head>
<body>

<p>Текст с left-padding</p>

<div class="a">
    В данном блоке поле слева равно 2см.
</div>

<div class="b">
    В данном блоке поле слева 50%.
</div>

</body>
</html>
