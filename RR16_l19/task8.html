<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>

        p{
            margin:20px;
            padding:15px;
            text-align:center;
            background:white;
        }

        .a{
            border:40px outset blue;
        }

        .b{
            border:40px inset red;
        }

        .c{
            border:40px groove;
            border-color:red lime blue lime;
        }

        .d{
            border:40px ridge;
            border-color:red lime blue magenta;
        }
    </style>
</head>
<body>

<p class="a">One-colored border! Стиль границ - outset</p>

<p class="b">Two-colored border! Стиль границ - inset</p>

<p class="c">Three-colored border! Стиль границ - groove</p>

<p class="d">Four-colored border! Стиль границ - ridge</p>

</body>
</html>
