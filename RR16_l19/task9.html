<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>

        p{
            text-align:center;
            padding:10px;
            margin:10px;
            text-align: top;
        }

        .a{
            border-top:8px dotted black;
            border-right:8px solid black;
            border-left:8px double black;
            border-bottom:8px dashed black;
        }

        .b{
            border-top:8px dotted black;
            border-right:8px solid black;
            border-left:8px solid black;
            border-bottom:8px dashed black;
        }

        .c{
            border-top:8px dotted black;
            border-right:8px solid black;
            border-left:8px solid black;
        }

        .d{
            border:8px dotted black;
        }
    </style>
</head>
<body>

<p class="a">This is some text in a paragraph.</p>
<p class="b">This is some text in a paragraph.</p>
<p class="c">This is some text in a paragraph.</p>
<p class="d">This is some text in a paragraph.</p>

</body>
</html>
