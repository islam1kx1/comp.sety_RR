<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>

        h1{
            font-size:60px;
        }

        div{
            height:100px;
            margin-bottom:2px;
            background:green;
            font-size:30px;
            padding:20px;
        }

        .a{opacity:0.1;}
        .b{opacity:0.3;}
        .c{opacity:0.6;}
        .d{opacity:1;}
    </style>
</head>
<body>

<h1>Полупрозрачные блоки</h1>

<div class="a">opacity 0.1</div>
<div class="b">opacity 0.3</div>
<div class="c">opacity 0.6</div>
<div class="d">opacity 1 (default)</div>

</body>
</html>
